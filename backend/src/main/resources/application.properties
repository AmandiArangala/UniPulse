spring.application.name=unipulse-backend

# -----------------------------------------------------------------------------
# PostgreSQL Database Datasource Configuration
# Fallback to localhost:5432 if SPRING_DATASOURCE_URL is not set
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://db.[REDACTED_DB_HOST].supabase.co:5432/postgres?sslmode=require

spring.datasource.username=postgres
spring.datasource.password=REDACTED_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------------------------------------
# JPA / Hibernate Settings
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable Flyway automated migration until scripts are ready
spring.flyway.enabled=false
