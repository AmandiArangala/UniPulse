spring.application.name=unipulse-backend

# -----------------------------------------------------------------------------
# PostgreSQL Database Datasource Configuration
# Fallback to localhost:5432 if SPRING_DATASOURCE_URL is not set
# -----------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/unipulse_db}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------------------------------------
# JPA / Hibernate Settings
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable Flyway automated migration until scripts are ready
spring.flyway.enabled=false

# -----------------------------------------------------------------------------
# JWT Security Configuration
# -----------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:REDACTED_JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

