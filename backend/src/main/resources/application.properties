spring.application.name=unipulse-backend

# -----------------------------------------------------------------------------
# PostgreSQL Database Datasource Configuration
# Fallback to localhost:5432 if SPRING_DATASOURCE_URL is not set
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require

spring.datasource.username=postgres.[REDACTED_DB_HOST]
spring.datasource.password=REDACTED_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------------------------------------
# JPA / Hibernate Settings
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable Flyway automated migration until scripts are ready
spring.flyway.enabled=false

# -----------------------------------------------------------------------------
# JWT Security Configuration
# -----------------------------------------------------------------------------
app.jwt.secret=REDACTED_JWT_SECRET
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

